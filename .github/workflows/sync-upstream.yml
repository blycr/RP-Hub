name: Sync upstream and deploy Pages

on:
  schedule:
    # Beijing time 08:00 every day.
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'sync-upstream'
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and merge upstream
        run: |
          set -e
          git remote add upstream https://github.com/STA1N156/RP-Hub.git
          git fetch upstream main

          mkdir -p /tmp/rphub-backup
          cp favicon.svg /tmp/rphub-backup/ 2>/dev/null || true
          cp .gitignore /tmp/rphub-backup/ 2>/dev/null || true
          cp CNAME /tmp/rphub-backup/ 2>/dev/null || true

          # A real conflict must stop the job. Never commit an unresolved merge.
          git merge upstream/main -m "Sync upstream $(date -u +%Y-%m-%d)" -X theirs

          cp /tmp/rphub-backup/favicon.svg . 2>/dev/null || true
          cp /tmp/rphub-backup/.gitignore . 2>/dev/null || true
          cp /tmp/rphub-backup/CNAME . 2>/dev/null || true

      - name: Download and reconcile local patches
        env:
          SYNC_REPO_PAT: ${{ secrets.SYNC_REPO_PAT }}
        run: |
          set -e
          AUTH=()
          if [ -n "$SYNC_REPO_PAT" ]; then AUTH=(-H "Authorization: Bearer $SYNC_REPO_PAT"); fi

          download() {
            if ! curl -sfL "${AUTH[@]}" "$1" -o "$2"; then
              echo "::error::Failed to download $1. Configure SYNC_REPO_PAT with read access to the private RP-Hub-Sync repository."
              exit 1
            fi
          }

          download https://raw.githubusercontent.com/blycr/RP-Hub-Sync/main/scripts/reapply-plazaId-patch.js /tmp/reapply-plazaId-patch.js
          download https://raw.githubusercontent.com/blycr/RP-Hub-Sync/main/scripts/reapply-multi-provider-patch.js /tmp/reapply-multi-provider-patch.js

          node /tmp/reapply-plazaId-patch.js assets/js/app.js
          node /tmp/reapply-multi-provider-patch.js .

          node --check assets/js/app.js
          git -c core.whitespace=cr-at-eol diff --check
          grep -q "RPHUB_PLAZA_CARD" assets/js/app.js
          grep -q "const selectModel = (modelId, providerId)" assets/js/app.js
          grep -q "getApiConfigForModel" assets/js/app.js
          grep -q "selectModel(model.id, model.providerId)" index.html

      - name: Commit reconciled result
        id: commit
        run: |
          set -e
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: reconcile local patches"
          fi

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push reconciled result
        if: steps.commit.outputs.changed == 'true'
        run: git push origin main

      - name: Summary
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            echo "Upstream and local patches were reconciled and pushed."
          else
            echo "Repository is already current; no push was needed."
          fi
